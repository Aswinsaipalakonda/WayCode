server {
    server_name waycode.aswinsai.tech;

    client_max_body_size 50M;

    # Fix for large cookies / OAuth headers (Supabase & GitHub session tokens)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;

        # WebSocket & Realtime streaming headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE & Long-lived connections
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/waycode.aswinsai.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/waycode.aswinsai.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = waycode.aswinsai.tech) {
        return 301 https://$host$request_uri;
    }

    server_name waycode.aswinsai.tech;
    listen 80;
    return 404;
}
